<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <title>TBA</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body data-mode="boot">
    <header>
      <span class="mark" aria-hidden="true">TBA</span>
      <div>
        <p class="kicker">Travel Business Agency</p>
        <p class="title">Accueil</p>
      </div>
    </header>
    <main>
      <p id="hello">Bonjour</p>
      <div id="stays" aria-busy="true"></div>
      <p id="offline" hidden>Vous êtes hors ligne. Le séjour déjà ouvert sur cet appareil réapparaît dès que le réseau revient.</p>
      <button type="button" id="retry" hidden>Réessayer</button>
    </main>
    <nav aria-hidden="true">
      <span>Accueil</span>
      <span>Réservations</span>
      <span>Transactions</span>
      <span>Mon compte</span>
    </nav>
    <script src="shell.js"></script>
  </body>
</html>
