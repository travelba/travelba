name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  PUPPETEER_SKIP_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: typecheck · lint · tests · migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres au format de la production pour rejouer la migration visée (scripts/check-migration-prod-shape.mjs).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` échoue si package.json et package-lock.json divergent : toute dépendance
      # s'ajoute avec `npm install <paquet>` et le lockfile part dans le même commit.
      - name: Installer (optionnels inclus)
        run: npm ci --include=optional

      - name: Types (next typegen + tsc)
        run: npm run typecheck

      # Bloquant : `eslint . --max-warnings=0`, un avertissement suffit à faire échouer.
      - name: Lint
        run: npm run lint

      - name: Tests (node:test)
        run: npm run test

      - name: Évals concierge
        run: npx tsx --tsconfig tsconfig.test.json --test lib/crm/concierge-eval.test.ts

      - name: Migrations (horodatage unique, nommage, rejeu sur une base de forme prod)
        env:
          MIGRATION_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: node scripts/check-migrations.mjs
