name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  PUPPETEER_SKIP_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: typecheck · lint · tests · migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm install` tant que package-lock.json n'a pas été régénéré avec `tsx` et
      # `@types/node@22` (édition manuelle de package.json dans le lot 4). Repasser à
      # `npm ci --include=optional` une fois le lockfile commité après fusion.
      - name: Installer (optionnels inclus)
        run: npm install --include=optional

      - name: Vérifier (tsc, eslint, node:test, migrations)
        run: npm run check
